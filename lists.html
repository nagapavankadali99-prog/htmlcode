<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Ordered list</h2>
    <ol type="i"> <!--1,a,A,i-->
        <li>apple</li>
        <li>banana</li>
        <li>peer</li>
        <li>coconut</li>
        <li>pineapple</li>
    </ol>

    <h2>Unordered list</h2>
    <ul type="none"> <!--disc,circle,square,none-->
        <li>black</li>
        <li>blue</li>
        <li>green</li>
        <li>pink</li>
        <li>red</li>

        </ul>

    <h2>Descriptive list</h2>
    <dl>
    <dt>HTML</dt>
    <dd>Hyper Text Markup Language</dd>

    <dt>CSS</dt>
    <dd>Cascading Style Sheet</dd>
</dl>

</body>
</html>
