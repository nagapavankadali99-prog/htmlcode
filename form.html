<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form action="" method="">
        <div>
            <label for="">Name</label>
            <input type="text" placeholder="Enter name" name="name" id="name" required />
        </div>

        <div>
            <label for="">Email address</label>
            <input type="text" placeholder="enter email id" name="emailid" id="emailid" required />
        </div>




        <div>
            <label for="">Password</label>
            <input type="text" placeholder="enter your password" name="password" id="password" required />
        </div>

        <div>
            <input type="radio" id="gmale" name="gender" />
            <label for="gmale">Male</label>


            <input type="radio" id="gfemale" name="gender" />
            <label for="gfemale">Female</label>

        </div>
        <div>
            <input type="checkbox" id="10th" />
            <label for="10th">10th</label>

            <input type="checkbox" id="intermediate" />
            <label for="intermediate">Intermediate</label>

            <input type="checkbox" id="B.TECH">
            <label for="B.TECH">B.Tech</label>
        </div>
        <div>
            <select name="city" id="city">
                <option value="">Select your city</option>
                <option value="Vijayawada">Vijayawada</option>
                <option value="Hyderabad">Hyderabad</option>
            </select>
        </div>

        <div>
            <textarea name="address" id="address" cols="60" placeholder="Enter your address"></textarea>

        </div>

        <div>
            <input type="date" name="" id="">

        </div>
    
    </form>
</body>

</html>
